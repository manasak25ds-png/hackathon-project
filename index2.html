<!DOCTYPE html>
<html>
<head>
<style>

body {
    background-image: url("image_3.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    
}
.card {
    background: rgba(0, 0, 0, 0.6);
    width: 70%;
    margin: 50px auto;
    padding: 30px;
    border-radius: 20px;
    text-align:center;
}
ol{
   padding:0;
   text-align:center;
   }

li{
 background:rgba(255,255,255,0.15);
 margin:10px auto;
 padding:8px,15px;
 border-radius:10px;
 width:fit-content;
}
h1 {
    
    text-align: center;
    font-size: 50px;
}

button:hover {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    border-radius:10px;
    colour:white;
    border:none;
}
#welcomeMessage {
    display:none;
    width: 300px;
    margin: 20px auto;
    margin-top: 20px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    font-size: 20px;
}
.success {
    background: rgba(0, 255, 150, 0.25);
    border: 2px solid white;
}
</style>
</head>
<body>
<div class="card">
<h1>My Hackathon Team</h1>
<p> we are a team of engineering students participating in our first hackathon</P>
<h2>Our Team Members</h2>
<ol>
<li>fazilath</li>
<li>sreeshanth</li>
<li>achyuth</li>
<li>keerthana</li>
<li>manasa</li>
</ol>
<input id="nameInput" type="text" placeholder="enter your name"><br><br>
<button id="joinButton">Join our team</button>
<p id="apiName"></p>
<p id="apiEmail"></p>
<p id="welcomeMessage"></p>
<script>
let apiName = document.getElementById("apiName");
let apiEmail = document.getElementById("apiEmail");
fetch("https://jsonplaceholder.typicode.com/users")
.then(function(response) {
    return response.json();
})
.then(function(data) {
    apiName.textContent = data[0].name;
    apiEmail.textContent = data[0].email;
});
let button = document.getElementById("joinButton");
let nameInput = document.getElementById("nameInput");
let welcomeMessage = document.getElementById("welcomeMessage");
        button.onclick = function() {

    if (nameInput.value === "") {
        welcomeMessage.textContent = "Please enter your name!";
    } 
else if (nameInput.value === "Manasa") {
    welcomeMessage.style.display = "block";
    welcomeMessage.textContent = "Welcome Manasa!👑";
    welcomeMessage.classList.add("success");
   }
else if (nameInput.value === "Fazilath") {
    welcomeMessage.style.display = "block";
    welcomeMessage.textContent = "Welcome fazilath!❤️";
    welcomeMessage.classList.add("success");
   }
else if (nameInput.value === "Sreeshanth") {
    welcomeMessage.style.display = "block";
    welcomeMessage.textContent = "Welcome Sreeshanth🚀!";
    welcomeMessage.classList.add("success");
   }

else {
    welcomeMessage.style.display = "block";
    welcomeMessage.textContent = "Welcome " + nameInput.value + "!";
    welcomeMessage.classList.add("success");
}
};
</script>
</div>
</body>
</html>
